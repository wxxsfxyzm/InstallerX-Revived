name: PR CI

on:
  pull_request:
    types: [opened, reopened, synchronize]
    branches:
      - main
      - dev

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Set the absolute minimum permissions for the GITHUB_TOKEN
permissions:
  contents: read # Required to checkout the code
  packages: read # Required if you pull dependencies from GitHub Packages

jobs:
  target_check:
    name: PR Target
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check PR target branch
        if: >
          github.event.pull_request.base.ref == 'main' &&
          github.event.pull_request.user.login != 'wxxsfxyzm'
        run: |
          echo "::error::External pull requests must target the 'dev' branch."
          echo "Please change the base branch from 'main' to 'dev'. You do not need to recreate the pull request."
          exit 1

  format_check:
    name: Code Style
    needs: target_check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Check code formatting
        run: ./gradlew spotlessCheck --no-configuration-cache

  unit_tests:
    name: Unit Tests
    needs: target_check
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          # Keep read-only to prevent cache poisoning from PRs
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unstable Debug Unit Tests
        # Use the same application ID override as the APK build.
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew testUnstableDebugUnitTest --no-configuration-cache -PAPP_ID="com.rosan.installer.x.revived.test"

  build_for_pr:
    name: Build Preview Debug APK
    needs:
      - format_check
      - unit_tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'zulu'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-scan-terms-of-use-url: "https://gradle.com/help/legal-terms-of-use"
          build-scan-terms-of-use-agree: "yes"
          build-scan-publish: false
          # Keep read-only to prevent cache poisoning from PRs
          cache-read-only: true

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Preview Debug APK
        # Use GITHUB_TOKEN only if strictly necessary for fetching packages
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew assemblePreviewDebug --no-configuration-cache -PAPP_ID="com.rosan.installer.x.revived.test"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: pr-debug-apk-${{ github.event.pull_request.head.sha }}
          path: app/build/outputs/apk/Preview/debug/app-Preview-debug.apk
          if-no-files-found: error
          retention-days: 7
          archive: false
